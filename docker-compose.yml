services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Écrase DATABASE_URL/SMTP_HOST du .env — services du réseau Docker.
      DATABASE_URL: postgresql+asyncpg://forge:forge@db:5432/forge
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    # Montés en dev pour le rechargement à chaud (--reload) sans
    # rebuild d'image à chaque changement. À retirer (ou à basculer
    # sur une image figée sans --reload) pour un déploiement.
    volumes:
      - ./forge:/app/forge
      - ./example_app:/app/example_app
      - ./scripts:/app/scripts
      - ./tests:/app/tests
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini
      - ./storage:/app/storage
    command: ["uvicorn", "example_app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  # Exécute les tâches planifiées (example_app/schedule.py). UNE seule
  # instance : deux runners exécuteraient chaque tâche deux fois. Pas de
  # rechargement à chaud ici — `docker compose restart scheduler` après
  # avoir modifié une tâche.
  scheduler:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://forge:forge@db:5432/forge
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    volumes:
      - ./forge:/app/forge
      - ./example_app:/app/example_app
      - ./scripts:/app/scripts
    command: ["python", "scripts/schedule.py", "work"]
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: forge
      POSTGRES_PASSWORD: forge
      POSTGRES_DB: forge
    ports:
      - "5432:5432"
    volumes:
      - forge_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forge -d forge"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"  # interface web
      - "1025:1025"  # SMTP

  # Interface web pour parcourir la base en dev — jamais exposée en
  # prod (pas de compte à sécuriser à part, un accès direct à la base
  # via le web est justement ce à éviter en public).
  adminer:
    image: adminer:latest
    ports:
      - "8081:8080"

volumes:
  forge_db_data:
